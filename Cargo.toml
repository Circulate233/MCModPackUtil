[package]
name = "mcmpu"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "A Rust CLI for maintaining CurseForge Minecraft modpack projects."
readme = "README.md"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:quick-xml", "dep:rfd"]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.41", features = ["derive", "env"] }
ctrlc = "3.4.7"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
flate2 = "1.1.5"
fs2 = "0.4.3"
html-escape = "0.2.13"
httpdate = "1.0.3"
oxipng = "9.1.5"
percent-encoding = "2.3.2"
quick-xml = { version = "0.38.3", features = ["serialize"], optional = true }
rayon = "1.12.0"
reqwest = { version = "0.12.22", features = ["blocking", "http2", "json", "rustls-tls"], default-features = false }
rfd = { version = "0.17.2", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.141", features = ["preserve_order"] }
semver = "1.0.27"
sha1 = "0.10.6"
sha2 = "0.10.9"
sys-locale = "0.3.2"
thiserror = "2.0.12"
tar = "0.4.44"
toml = "0.8.23"
walkdir = "2.5.0"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
serde_yaml_ng = "0.10.0"
tempfile = "3.20.0"
