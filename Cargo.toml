[package]
name = "mcmpu"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Rust CLI for maintaining CurseForge Minecraft modpack projects."
readme = "README.md"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.41", features = ["derive", "env"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
html-escape = "0.2.13"
oxipng = "9.1.5"
rayon = "1.12.0"
reqwest = { version = "0.12.22", features = ["blocking", "json", "rustls-tls"], default-features = false }
rfd = { version = "0.17.2", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.141", features = ["preserve_order"] }
sha1 = "0.10.6"
sys-locale = "0.3.2"
thiserror = "2.0.12"
toml = "0.8.23"
walkdir = "2.5.0"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.20.0"
